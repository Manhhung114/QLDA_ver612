name: F5 Auth Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth_f5_diag.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build patched source and print auth flow
        run: |
          python build_v621_webopt.py
          python - <<'PY'
          from pathlib import Path
          from v622_auth_refresh_v4 import patch_auth_refresh_v4
          p = Path('dist/streamlit_app.py')
          text = patch_auth_refresh_v4(p.read_text(encoding='utf-8'))
          lines = text.splitlines()
          needles = [
              '_QLDA_AUTH_COOKIE =',
              'def _browser_session_cookie',
              'def _qlda_cookie_controller_v4',
              'def _gateway_session_token',
              'def _gateway_logout',
              'qlda_auth_restored_from_cookie',
              '_qlda_cookie_written_for_token',
              '_write_browser_session_cookie(token)',
              'gw.login(',
              'identity =',
          ]
          shown = set()
          for needle in needles:
              for i, line in enumerate(lines):
                  if needle in line:
                      a = max(0, i - 14)
                      b = min(len(lines), i + 30)
                      key = (a,b)
                      if key in shown:
                          continue
                      shown.add(key)
                      print(f'\n===== {needle} @ {i+1} =====')
                      for j in range(a,b):
                          print(f'{j+1:05d}: {lines[j]}')
                      break
          PY
