name: V6.22 Build Check

on:
  push:
    branches: [main]
    paths:
      - 'streamlit_app.py'
      - 'build_v621_webopt.py'
      - 'v622_auth_refresh_v4.py'
      - 'requirements.txt'
      - 'postgres_backend_v622.py'
      - 'streamlit_secrets_v622.py'
      - 'settings_store.py'
      - 'v621_webopt_runtime.py'
      - 'v615_runtime_patch.py'
      - 'cloud_db.py'
      - 'ai_service.py'
      - 'ai_streaming_patch.py'
      - 'legal_documents.py'
      - 'v621_webopt_source/**'
      - '.github/workflows/v622-build-check.yml'
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V6.22 support modules
        run: |
          python -m py_compile streamlit_app.py build_v621_webopt.py v622_auth_refresh_v4.py postgres_backend_v622.py streamlit_secrets_v622.py settings_store.py v621_webopt_runtime.py v615_runtime_patch.py cloud_db.py ai_service.py ai_streaming_patch.py legal_documents.py
      - name: Rebuild and validate exact F5 auth V4 source
        run: |
          python build_v621_webopt.py
          python - <<'PY'
          from pathlib import Path
          from v622_auth_refresh_v4 import PATCH_MARKER, patch_auth_refresh_v4
          p = Path('dist/streamlit_app.py')
          text = patch_auth_refresh_v4(p.read_text(encoding='utf-8'))
          region = text[text.index(PATCH_MARKER):text.index('def _gateway_session_token()')]
          assert 'streamlit_cookies_controller' in region
          assert 'st.stop()' not in region
          assert 'controller.set(' in region
          assert 'controller.remove(' in region
          assert 'max_age=float(_QLDA_AUTH_COOKIE_MAX_AGE)' in region
          assert 'same_site="lax"' in region
          assert 'time.sleep(0.50)' in text
          assert 'time.sleep(0.35)' in text
          assert 'token = _browser_session_cookie()' in text
          assert '_qlda_cookie_written_for_token' in text
          compile(text, 'dist/streamlit_app_v4.py', 'exec')
          Path('dist/streamlit_app_v4.py').write_text(text, encoding='utf-8')
          print('V6.22 F5 auth V4 source: OK')
          PY
      - name: List Railway remnants in built source
        run: |
          echo '--- dist/streamlit_app.py ---'
          grep -ni 'railway' dist/streamlit_app.py || true
          echo '--- dist/streamlit_app_v4.py ---'
          grep -ni 'railway' dist/streamlit_app_v4.py || true
      - name: Verify cookie controller runtime API
        run: |
          python -m pip install --disable-pip-version-check --quiet 'streamlit>=1.48,<2' 'streamlit-cookies-controller==0.0.4'
          python - <<'PY'
          import inspect
          from streamlit_cookies_controller import CookieController
          params = inspect.signature(CookieController.set).parameters
          for name in ('path','max_age','secure','same_site'):
              assert name in params
          assert hasattr(CookieController, 'remove')
          print('CookieController runtime API: OK')
          PY
      - name: Verify fail-open initial render invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('dist/streamlit_app_v4.py').read_text(encoding='utf-8')
          region = text[text.index('# V6.22 AUTH REFRESH V4'):text.index('def _gateway_session_token()')]
          imports = [line for line in region.splitlines() if 'from streamlit_cookies_controller import' in line]
          assert imports and all(line.startswith('    ') for line in imports), imports
          assert 'st.stop()' not in region
          print('Fail-open initial render invariant: OK')
          PY
      - name: Verify Gemini secrets bridge order
        run: |
          python - <<'PY'
          from build_v621_webopt import build
          text = build().read_text(encoding='utf-8')
          a = text.index('from streamlit_secrets_v622 import apply_streamlit_secrets_to_env')
          b = text.index('apply_streamlit_secrets_to_env()')
          c = text.index('from postgres_backend_v622 import install_postgres_backend')
          d = text.index('install_postgres_backend()')
          e = text.index('from v621_webopt_runtime import install_runtime')
          f = text.index('install_runtime()')
          assert a < b < c < d < e < f
          print('V6.22 Streamlit secrets/Gemini bootstrap order: OK')
          PY
