services:
  - type: web
    name: qlda-xaydung-v6
    runtime: docker
    plan: starter
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /_stcore/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: qlda-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: QLDA_DB_PATH
        value: /var/data/qlda_cloud.db
      - key: QLDA_RENDER_PERSISTENT_DISK
        value: "true"
      - key: QLDA_DRIVE_ENFORCE_RBAC
        value: "true"
      - key: QLDA_DRIVE_DIRECT_MAX_UPLOAD_MB
        value: "2048"
      - key: QLDA_DRIVE_LEGACY_MAX_UPLOAD_MB
        value: "30"
      - key: QLDA_DRIVE_TIMEOUT
        value: "90"
      - key: QLDA_DRIVE_WEBAPP_URL
        sync: false
      - key: QLDA_DRIVE_API_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_WEB_SEARCH
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_CX
        sync: false
